name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The dev toolchain (Vitest, jsdom) needs Node 22.12 or newer.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # e2e tests run the built bundle in real browsers.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - run: npm run build
      - run: npx publint && npx attw --pack .
